name: Cloud check in action
on:
  push:
    branches:
      - main
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: 0 23 * * *
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: user 
    steps:
      - name: 🔀 random delay 0-300 seconds
        run: sleep $((RANDOM % 301))

      - name: 🔌 Check out code
        uses: actions/checkout@main

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@main
        with:
          node-version: 18
          cache: npm

      - name: 👾 Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV
      
      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: cloud189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: cloud189-token-

      - name: 🔧 Init secrets
        uses: shine1594/secrets-to-env-action@master
        with:
          secrets: ${{ toJSON(secrets) }}
          secrets_env: production
          prefix_prod: ""
          file_name_prod: .env

      - name: 📡 Init dependencies
        run: npm install

      - name: 🚀 Run
        uses: nick-fields/retry@master
        env:
          TZ: Asia/Shanghai    # <--- 加上这一行，让 Node 脚本按北京时间打印日志
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start | tee checkin_result.txt   # <--- 修改这一行
               
      - name: 📱 发送详细 Server酱 通知
        if: always()
        env:
          SENDKEY: ${{ secrets.SERVER_KEY }}
        run: |
          echo "===== 检查日志文件 ====="
          cat checkin_result.txt || echo "文件不存在"
          
          echo "===== 提取关键信息 ====="
          MSG=$(grep -E "个人签到任务|执行完毕|个人容量|家庭容量" checkin_result.txt | \
                sed 's/\*\*\*\*[0-9]*: //g' | \
                sed 's/\[INFO\] //g' | \
                sed -E 's/\[([0-9]{4}-[0-9]{2}-[0-9]{2})T([0-9]{2}:[0-9]{2}:[0-9]{2})\.[0-9]{3}\]/[\1 \2]/g')
          
          # 如果没抓到，说明可能报错了
          if [ -z "$MSG" ]; then
            MSG="⚠️ 签到执行异常，请查看日志！\n\n$(tail -n 5 checkin_result.txt)"
          fi
          
          echo "提取到的内容为:"
          echo -e "$MSG"
          
          echo "===== 发送 Server酱 通知 ====="
          curl -s -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" \
               -d "title=天翼云盘签到结果" \
               --data-urlencode "desp=${MSG}"
      
      - name: 🔑 Compute token hash
        if: always()
        run: |
          NEW_HASH=$(find .token -name '*.json' -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "TOKEN_HASH=${NEW_HASH}" >> $GITHUB_ENV

      - name: 📹 Save cached Cookie
        if: always() && env.TOKEN_HASH != ''
        uses: actions/cache/save@v4
        with:
          path: .token
          key: cloud189-token-${{ env.TOKEN_HASH }}

      - name: 🚗 Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push

      - name: 🎉 Delete old workflow run
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
